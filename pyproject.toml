[build-system]
requires = ["setuptools>=42", "wheel", "scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "NumbaMinpack"
authors = [{name="Nicholas Wogan", email="nicholaswogan@gmail.com"}]
version = "0.1.3"
requires-python =">3.6"
license="MIT"
dependencies=["numpy","numba"]
readme = "README.md"
description = "Python wrapper of Minpack (root finding) which can be called from within numba functions."


[project.urls]
Homepage = "https://github.com/Nicholaswogan/NumbaMinpack"

[tool.setuptools.package-data]
package_name=["NumbaMinpack"]

[tool.py-build-cmake.cmake]
options={SKBUILD="ON"}
